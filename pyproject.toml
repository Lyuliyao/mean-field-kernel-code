[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mean-field-kernel"
version = "0.1.0"
description = "MVNN research code and curated reproducibility data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "scipy>=1.12", "pandas>=2.2", "matplotlib>=3.9", "PyYAML>=6"]

[project.optional-dependencies]
train = [
  "jax==0.4.38; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "jax==0.5.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "flax==0.10.4", "optax==0.2.4", "orbax-checkpoint==0.11.5", "chex==0.1.89",
]
mpi = ["mpi4py>=3"]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/threebody"]
addopts = "-ra"
markers = ["slow: longer-running integration tests"]
