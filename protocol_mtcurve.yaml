# Protocol: 1D Motsch-Tadmor MVNN training/test learning curve
# -------------------------------------------------------------
# Replaces the three-representative-case assessment of manuscript §2.3.1 with
# a quantitative learning-curve experiment on a substantially larger
# independent test set. The three original TEST_DATA3 cases remain purely
# visual examples and contribute to no aggregate statistic here.

schema_version: 1
experiment_name: mtcurve_learning_curve
status: locked_before_runs

ground_truth:
  # dX_i/dt = [sum_j w_ij (x_j - x_i)] / [sum_j w_ij + 1e-12],
  # w_ij = exp(-((x_j - x_i)/ell)^2), self-terms removed; explicit Euler.
  source: SIMPLE/CASE5/DATA_GENERATION3/simulation.py (ported verbatim, MPI removed)
  n_agents: 16000
  ell: 0.5
  dt: 0.01
  frames_used: 201            # l = 0..200, horizon T = 2 (manuscript convention)
  denominator_epsilon: 1.0e-12
  port_verification: regenerate training seed 1 and match the stored
    trajectory on frames 0..200 to <= 1e-8 max abs difference

data_sets:
  training_pool:
    source: SIMPLE/CASE5/DATA_GENERATION3/data/opinion_traj_{seed}.npy
    seeds: 1..100             # existing 100 independently generated trajectories
  validation:                 # early stopping ONLY
    count: 10
    seeds: 1001..1010
  test:                       # final evaluation ONLY, fixed for every M/replicate
    count: 30
    seeds: 2001..2030
  initial_condition_family: identical for all three sets — mixture of 2-8
    Gaussian components, means U[0,3], component std 0.5, Dirichlet(1) weights,
    mean-centered (no distribution shift; OOD generalization is studied
    separately in the existing experiments)
  manifest: outputs/mtcurve/data/manifest.json (path, IC parameters, seed,
    sha256 of every trajectory; written and committed before any model run)

training_sizes:
  M_values: [5, 10, 20, 40, 60, 80, 100]
  replicates: 3               # independent network init + data order + subset permutation
  nested_subsets: within each replicate, subset(M) = first M entries of a
    fixed recorded permutation of the pool, so larger M only adds trajectories
  permutation_stream: 777     # SeedSequence([777, replicate])
  model_seed_stream: 888      # SeedSequence([888, replicate])
  batch_seed_stream: 999      # SeedSequence([999, replicate, M])

mvnn:
  architecture:
    feature_layers: [12, 24, 48]      # manuscript CASE5 convention
    describe_layers: [128, 128, 128, 1]
    activation: tanh
    dtype: float64
  loss: manuscript_relative_l2        # sqrt(sum((v - b)^2))/sqrt(sum(v^2))
  optimizer: adam
  learning_rate_schedule: exponential_decay(1e-3, transition_steps=100000,
    decay_rate=0.9, end_value=1e-7)   # manuscript convention
  batch_snapshots: 100                # full N agents per snapshot
  max_steps: 30000                    # identical fixed budget for every M
  validation:
    metric: relative_l2_increment_loss_on_all_validation_snapshots
    every_steps: 250
    early_stop_patience_evals: 8
    early_stop_min_relative_improvement: 0.001
    restore: best_validation_checkpoint
  recorded: [best_training_step, stopping_step, training_walltime]

evaluation:
  protocol_identical_for_training_and_test: true
  rollout: autonomous explicit Euler with the learned drift, dt 0.01,
    200 steps from the frame-0 initial condition of each reference trajectory
  rollout_sets:
    training: all M trajectories of the model's own training subset
    validation: the 10 fixed validation trajectories (diagnostic only)
    test: the 30 fixed independent test trajectories
  density_grid: {lower: -5.0, upper: 5.0, cells: 640}
  kde_bandwidth: 0.1                  # fixed Gaussian bandwidth, all methods/frames
  metric_times: t = 0.0, 0.1, ..., 2.0 (frame stride 10); t = 0 rows are
    recorded but EXCLUDED from every time-averaged error
  metrics:
    relative_density_L2: "||rho_mvnn - rho_true||_L2 / (||rho_true||_L2 + 1e-8)"
    W1: empirical particle quantile W1 (4096 midpoint quantiles)
    drift_NRMSE: sqrt( sum |b_mvnn - b_true|^2 / sum |b_true|^2 ) evaluated on
      TRUE state-measure pairs of the reference trajectory (frames t = 0.1..2.0,
      all 16000 agents); never along the MVNN-predicted trajectory
  drift_truth_cache: outputs/mtcurve/drift_truth/ (precomputed once per
    reference trajectory with the ported exact drift)

aggregation:
  per_model: mean over the model's training subset trajectories; mean over all
    30 test trajectories; all per-trajectory, per-time errors retained in the
    raw CSV
  across_replicates: mean and standard deviation (ddof=1) over the 3 replicates
  confidence_interval: 95% hierarchical bootstrap (2000 resamples, seed 20260713)
    resampling first the trained-model replicate, then trajectories within the
    resampled replicate — the 30 test trajectories are never treated as 30
    independently trained models
  trajectory_aggregate_for_drift: sqrt(sum_f num_f / sum_f den_f) over frames
    (ratio of sums, not mean of per-frame ratios)

outputs:
  raw_csv: outputs/mtcurve/summary/mvnn_learning_curve_raw.csv with columns
    [training_M, training_replicate, trajectory_type, trajectory_seed, time,
     relative_density_L2, W1, drift_NRMSE, best_training_step, stopping_step,
     training_walltime]; trajectory_type in {training, validation, test}
  summary_csv: outputs/mtcurve/summary/mvnn_learning_curve_summary.csv
  primary_figure: figures/mtcurve/mvnn_training_test_learning_curve.pdf
    with panels (a) time-averaged relative density L2 vs M and (b) drift NRMSE
    vs M; each panel shows training and independent-test curves with
    uncertainty bands over all seven M values; logarithmic M axis
  supplementary_figure: figures/mtcurve/mvnn_learning_curve_w1.pdf
  validation_report: outputs/mtcurve/summary/validation_report.json verifying
    (1) test/pool seed and content disjointness, (2) no test data in early
    stopping, (3) identical test set for every M and replicate, (4) identical
    rollout protocol for training and test evaluation, (5) no test-based
    hyperparameter or stopping choices (all fixed in this committed protocol),
    (6) all 30 test trajectories present in every reported statistic

slurm:
  data_generation: CPU, <= 2 h
  drift_truth: GPU, <= 30 min
  train_eval_array: GPU array of 21 tasks (7 M x 3 replicates), <= 60 min each
  aggregate: CPU, <= 1 h
